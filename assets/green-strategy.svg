<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="1600" height="780" fill="#fbfaf7"/><text x="800" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-weight="400" fill="#2f3033">One promise, expressed across every touchpoint</text><text x="800" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#6d805f">GREEN PLATTER · BRAND &amp; PRODUCT STRATEGY</text><path d="M125 400H1475" stroke="#95a980" stroke-width="4"/><path d="M1475 400l-22-13v26z" fill="#95a980"/><g font-family="Arial,sans-serif"><g><circle cx="255" cy="400" r="10" fill="#fbfaf7" stroke="#95a980" stroke-width="4"/><path d="M255 390V265" stroke="#95a980" stroke-width="3"/><rect x="140" y="175" width="230" height="90" rx="12" fill="#303136"/><text x="255" y="215" text-anchor="middle" font-size="18" fill="#fff">POSITION</text><text x="255" y="242" text-anchor="middle" font-size="16" fill="#e9e9e7">healthy made easy</text><text x="255" y="466" text-anchor="middle" font-size="18" fill="#6d6d6b">Define the promise</text></g><g><circle cx="620" cy="400" r="10" fill="#fbfaf7" stroke="#95a980" stroke-width="4"/><path d="M620 410V535" stroke="#95a980" stroke-width="3"/><rect x="505" y="535" width="230" height="90" rx="12" fill="#303136"/><text x="620" y="575" text-anchor="middle" font-size="18" fill="#fff">IDENTITY</text><text x="620" y="602" text-anchor="middle" font-size="16" fill="#e9e9e7">fresh and optimistic</text><text x="620" y="676" text-anchor="middle" font-size="18" fill="#6d6d6b">Create recognition</text></g><g><circle cx="985" cy="400" r="10" fill="#fbfaf7" stroke="#95a980" stroke-width="4"/><path d="M985 390V265" stroke="#95a980" stroke-width="3"/><rect x="870" y="175" width="230" height="90" rx="12" fill="#303136"/><text x="985" y="215" text-anchor="middle" font-size="18" fill="#fff">PRODUCT</text><text x="985" y="242" text-anchor="middle" font-size="16" fill="#e9e9e7">simple choices</text><text x="985" y="466" text-anchor="middle" font-size="18" fill="#6d6d6b">Make it useful</text></g><g><circle cx="1350" cy="400" r="10" fill="#fbfaf7" stroke="#95a980" stroke-width="4"/><path d="M1350 410V535" stroke="#95a980" stroke-width="3"/><rect x="1235" y="535" width="230" height="90" rx="12" fill="#303136"/><text x="1350" y="575" text-anchor="middle" font-size="18" fill="#fff">CAMPAIGN</text><text x="1350" y="602" text-anchor="middle" font-size="16" fill="#e9e9e7">repeatable stories</text><text x="1350" y="676" text-anchor="middle" font-size="18" fill="#6d6d6b">Build consistency</text></g></g></svg>